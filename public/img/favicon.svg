<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" fill="#9DD6C3" rx="8"/>

  <!-- Hoodie body -->
  <path d="M 18 40 Q 18 45 20 48 L 44 48 Q 46 45 46 40 L 46 38 L 18 38 Z" fill="#4A4A4A"/>

  <!-- Hoodie strings -->
  <line x1="28" y1="46" x2="28" y2="52" stroke="#E8D5C4" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="46" x2="36" y2="52" stroke="#E8D5C4" stroke-width="2" stroke-linecap="round"/>

  <!-- Hood (rounder ellipse) -->
  <ellipse cx="32" cy="27" rx="18" ry="18" fill="#5A5A5A"/>

  <!-- Face (rounder ellipse) -->
  <ellipse cx="32" cy="30" rx="11" ry="11" fill="#F4C790"/>

  <!-- Eyes (simple dots) -->
  <circle cx="27" cy="32" r="1.5" fill="#2C2C2C"/>
  <circle cx="37" cy="32" r="1.5" fill="#2C2C2C"/>

  <!-- Mouth (small o) -->
  <circle cx="32" cy="37" r="2" fill="#E89B9B"/>

  <!-- Cheeks (blush) -->
  <ellipse cx="26" cy="35.5" rx="2.5" ry="1.75" fill="#FFB3BA" opacity="0.6"/>
  <ellipse cx="38" cy="35.5" rx="2.5" ry="1.75" fill="#FFB3BA" opacity="0.6"/>

  <!-- Sparkles -->
  <g fill="#FFFFFF" opacity="0.8">
    <path d="M 10 13 L 11 15 L 13 16 L 11 17 L 10 19 L 9 17 L 7 16 L 9 15 Z"/>
    <path d="M 52 10 L 53 12 L 55 13 L 53 14 L 52 16 L 51 14 L 49 13 L 51 12 Z"/>
    <path d="M 54 48 L 55 50 L 57 51 L 55 52 L 54 54 L 53 52 L 51 51 L 53 50 Z"/>
  </g>
</svg>
