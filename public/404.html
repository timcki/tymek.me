<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the page (and the shader canvas) extend into the
       safe areas behind ios safari's status bar and toolbar -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  
  <title>404</title>
  <link rel="icon" type="image/png" sizes="32x32" href="https://tymek.me/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="https://tymek.me/img/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://tymek.me/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>

  /* light mode colors */
  body {
    --primary-color: #5871a2;
    --primary-pale-color: #5871a233;
    --primary-decoration-color: #5871a210;
    --bg-color: #faf9f7;
    --text-color: #26242e;
    --text-pale-color: #6f6b7a;
    --text-decoration-color: #a5a1af;
    --highlight-mark-color: #5871a220;

    --callout-note-color: #5871a2;
    --callout-tip-color: #268556;
    --callout-important-color: #885fc9;
    --callout-warning-color: #ab6632;
    --callout-caution-color: #c64e4e;
  }

  /* dark mode colors */
  body.dark {
    --primary-color: #6f8fd1;
    --primary-pale-color: #6f8fd166;
    --primary-decoration-color: #6f8fd112;
    --bg-color: #16161e;
    --text-color: #c9c7d4;
    --text-pale-color: #8a8798;
    --text-decoration-color: #5c5966;
    --highlight-mark-color: #8296cb3b;

    --callout-note-color: #6f8fd1;
    --callout-tip-color: #47976f;
    --callout-important-color: #9776cd;
    --callout-warning-color: #ad7a52;
    --callout-caution-color: #d06161;
  }

  /* typography */
  body {
    --main-font: 'Inter', ui-sans-serif, system-ui, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
    --code-font: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
    --homepage-max-width: 768px;
    --main-max-width: 768px;
    --avatar-size: 60px;
    --font-size: 16px;
    --line-height: 1.75;
    --img-border-radius: 4px;
    --detail-border-radius: 4px;
    --dark-mode-img-brightness: 0.75;
    --dark-mode-chart-brightness: 0.75;
    --inline-code-border-radius: 3px;
    --inline-code-bg-color: var(--primary-decoration-color);
    --block-code-border-radius: 4px;
    --block-code-border-color: var(--primary-color);
    --detail-border-color: var(--primary-color);
  }

  h1, h2, h3, h4, h5, h6 {
    font-family: 'Space Grotesk', var(--main-font);
    letter-spacing: -0.02em;
  }

  /* shader background: canvas sits behind everything, body goes transparent
     only when the canvas is actually running (bg-shader.js adds the class) */
  #bg-canvas {
    position: fixed;
    /* bleed past the viewport so ios safari composites real shader pixels
       behind its liquid glass chrome instead of a flat fallback tint */
    top: -100px;
    left: 0;
    width: 100vw;
    height: calc(100vh + 260px);
    width: 100lvw;
    height: calc(100lvh + 260px);
    z-index: -1;
    pointer-events: none;
  }

  html body.has-bg-canvas {
    background-color: transparent;
  }

  /* scroll runway: ios safari only composites page pixels behind its liquid
     glass chrome when scrollY > 0, so short pages get 160px of fake scroll
     height and are pre-scrolled past it by bg-shader.js (value must match
     RUNWAY there) */
  body.has-runway {
    padding-top: 160px;
    /* bottom padding keeps document content below the viewport, otherwise
       safari's bottom bar sits at the page end and falls back to a flat tint */
    padding-bottom: 160px;
    /* lvh, not dvh: dvh changes as the toolbar collapses mid-scroll, which
       would make the document height (and our scroll bounds) flutter */
    min-height: calc(100lvh + 320px);
  }

  /* cross-document view transitions: the browser crossfades between pages
     instead of hard-cutting. no-op in browsers without support */
  @view-transition {
    navigation: auto;
  }
  @media (prefers-reduced-motion: reduce) {
    ::view-transition-group(*),
    ::view-transition-old(*),
    ::view-transition-new(*) {
      animation: none !important;
    }
  }
  /* mobile opts out of the crossfade: ios snapshots the scrollY=0 state and
     shows flat black bars for the duration of the animation. an instant
     transition avoids that; splash carry-over works independently */
  @media (max-width: 760px) and (pointer: coarse) {
    ::view-transition-group(*),
    ::view-transition-old(*),
    ::view-transition-new(*) {
      animation: none !important;
    }
  }

  /* liquid glass ui: translucent pills and cards floating over the shader.
     backdrop-filter samples the canvas behind them, so the glass genuinely
     refracts the moving colors. never apply this to fixed/sticky elements:
     ios safari would adopt their background for its toolbar tint */
  body {
    --glass-bg: rgba(255, 255, 255, 0.3);
    --glass-bg-hover: rgba(255, 255, 255, 0.55);
    --glass-border: rgba(38, 36, 46, 0.1);
    --glass-shadow: rgba(38, 36, 46, 0.1);
  }
  body.dark {
    --glass-bg: rgba(150, 160, 195, 0.08);
    --glass-bg-hover: rgba(150, 160, 195, 0.16);
    --glass-border: rgba(200, 205, 230, 0.1);
    --glass-shadow: rgba(0, 0, 0, 0.3);
  }

  body.homepage #links #left a,
  body .layout-list .read-more a {
    padding: 0.3em 0.95em;
    line-height: 1.5;
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(7px);
    backdrop-filter: blur(7px);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
  }
  body.homepage #links #left a:hover,
  body .layout-list .read-more a:hover {
    background: var(--glass-bg-hover);
    transform: translateY(-1px);
    box-shadow: 0 6px 18px var(--glass-shadow);
  }
  body.homepage #links #left a:active,
  body .layout-list .read-more a:active {
    background: var(--glass-bg-hover);
    transform: scale(0.97);
    box-shadow: none;
  }

  /* the theme underlines nav/read-more links with the primary color at equal
     specificity, and its stylesheet loads after this one, so out-rank it:
     pills and cards get a uniform hairline on every edge, in every state */
  html body.homepage #links #left a,
  html body .layout-list .read-more a,
  html body .layout-list a.post,
  html body.homepage #links #left a:hover,
  html body .layout-list .read-more a:hover,
  html body .layout-list a.post:hover {
    border-bottom: 1px solid var(--glass-border);
  }

  /* socials live in #info (moved there in the home.html override), so they
     need the layout the theme only gives them inside #links. plain icons,
     no glass: they read as clickable on their own */
  body.homepage #info #right {
    display: flex;
    align-items: center;
    gap: 0.7em;
    margin-left: auto;
  }
  body.homepage #info #right a,
  body.homepage #info #right button {
    -webkit-tap-highlight-color: transparent;
    text-decoration: none;
    line-height: 0;
    color: var(--text-color);
  }
  body.homepage #info #right a:hover,
  body.homepage #info #right button:hover {
    color: var(--primary-color);
  }
  body.homepage #info #right button {
    padding: 0;
    border: none;
    background-color: transparent;
    cursor: pointer;
  }
  /* let the pill drop below the header instead of crushing the bio */
  body.homepage #info {
    flex-wrap: wrap;
  }
  /* on phones the pill wraps under the bio; pin it to the name row instead */
  @media (max-width: 640px) {
    body.homepage #info {
      position: relative;
    }
    body.homepage #info #right {
      position: absolute;
      /* optical centering against the name line; 15px matches #info padding */
      top: -0.3em;
      right: 15px;
      margin-left: 0;
    }
  }

  /* post entries become quiet glass cards (home recent list + blog listing);
     the material only asserts itself on hover/press */
  body .layout-list a.post {
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(7px);
    backdrop-filter: blur(7px);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 0.8em 1.1em;
    margin: 0.7em 0;
    transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
  }
  body .layout-list a.post:hover {
    background: var(--glass-bg-hover);
    transform: translateY(-2px);
    box-shadow: 0 8px 22px var(--glass-shadow);
  }
  body .layout-list a.post:active {
    background: var(--glass-bg-hover);
    transform: scale(0.99);
    box-shadow: none;
  }

  /* no bounce past the absolute document edges on mobile: parking at exact
     scrollY 0/max flips safari's chrome to a flat tint. the runway settle
     in bg-shader.js provides the rubber-band feel instead */
  @media (max-width: 760px) and (pointer: coarse) {
    html {
      overscroll-behavior-y: none;
    }
  }

</style>

  <link rel="stylesheet" href="https://tymek.me/main.css">
  
  <script defer src="https://tymek.me/js/bg-shader.js"></script>

</head>

<body class="not-found">
  <script>
    // pre-scroll past the runway before first paint: the deferred shader
    // script runs too late, and view transitions animate over the early
    // scrollY=0 window where ios paints its bars with a flat fallback
    // color. values must match RUNWAY in bg-shader.js and _custom_css.html
    if (window.matchMedia('(max-width: 760px) and (pointer: coarse)').matches) {
      // manual restoration: safari would otherwise re-scroll toward 0 after
      // load, making the settle visibly drag the page back to the runway
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      document.body.classList.add('has-runway');
      if (window.scrollY < 160) window.scrollTo(0, 160);
    }
  </script>
  
  <script>
    const theme = sessionStorage.getItem('theme');
    const match = window.matchMedia("(prefers-color-scheme: dark)").matches;
    if ((theme && theme == 'dark') || (!theme && match)) {
      document.body.classList.add('dark');
      const hl = document.querySelector('link#hl');
      if (hl) hl.href = 'https://tymek.me/giallo-dark.css';
    }
  </script>
  
  
<div class="wrapper">
  <p class="error">
    404 Not Found
  </p>
  <a class="instant" href="https://tymek.me">« back to home »</a>
</div>

  
  <script src="https://tymek.me/js/main.js"></script>
</body>

</html>
