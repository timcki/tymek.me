{%- if config.extra.analytics_endpoint %}

   served at <endpoint>.js. it skips localhost, so zola serve isn't counted #}
<script data-goatcounter="{{ config.extra.analytics_endpoint | safe }}" async
  src="{{ config.extra.analytics_endpoint | safe }}.js"></script>
{%- endif %}
